<div class="admin-container">
  <header class="admin-header">
    <h1>La Trattoria - Panel</h1>
    <div class="header-info">
      <span>{{ authService.nombre() }}</span>
      <button (click)="logout()">Cerrar sesión</button>
    </div>
  </header>

  <nav class="admin-nav">
    @if (authService.isPersonal()) {
      <a routerLink="notificaciones" routerLinkActive="active">Notificaciones</a>
    }
    @if (authService.isAdmin()) {
      <a routerLink="pedidos" routerLinkActive="active">Pedidos</a>
      <a routerLink="gestion-platos" routerLinkActive="active">Gestión de platos</a>
      <a routerLink="gestion-categorias" routerLinkActive="active">Categorías</a>
    }
  </nav>

  <main class="admin-content">
    <router-outlet />
  </main>

  @if (toast.visible()) {
    <div class="toast">{{ toast.mensaje() }}</div>
  }
</div>

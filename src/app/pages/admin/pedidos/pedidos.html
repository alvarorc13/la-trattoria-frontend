<div class="pedidos-container">
  <h2>Lista de Pedidos</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Cliente</th>
        <th>Fecha</th>
        <th>Total</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let pedido of pedidos">
        <td>{{ pedido.id }}</td>
        <td>{{ pedido.cliente?.nombre || pedido.usuario?.nombre }}</td>
        <td>{{ pedido.fecha }}</td>
        <td>{{ pedido.total }}</td>
        <td>
          <button (click)="eliminarPedido(pedido.id)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

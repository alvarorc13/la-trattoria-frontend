<div class="gestion">
  <h2>Gestión de Pedidos</h2>
  <div class="platos-tabla">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Mesa</th>
          <th>Fecha</th>
          <th>Total</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (pedido of pedidos(); track pedido.id) {
          <tr>
            <td>{{ pedido.id }}</td>
            <td>{{ pedido.mesa.numero }}</td>
            <td>{{ pedido.fechaHora | date:'short' }}</td>
            <td>{{ pedido.total | currency:'EUR' }}</td>
            <td>
              <span class="badge" [class.badge-activo]="pedido.estado === 'nuevo'" [class.badge-inactivo]="pedido.estado !== 'nuevo'">
                {{ pedido.estado }}
              </span>
            </td>
            <td class="acciones">
              <button class="btn-eliminar" (click)="confirmarEliminar(pedido)">Eliminar</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>

@if (modalVisible()) {
  <div class="modal-overlay" (click)="cerrarModal()">
    <div class="modal" (click)="$event.stopPropagation()">
      <p>{{ modalMensaje }}</p>
      <div class="modal-acciones">
        <button class="btn-modal-cancelar" (click)="cerrarModal()">Cancelar</button>
        <button class="btn-modal-confirmar" (click)="aceptarModal()">Confirmar</button>
      </div>
    </div>
  </div>
}
